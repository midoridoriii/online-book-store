databaseChangeLog:
  - changeSet:
      id: assign-user-role-to-existing-users
      author: midoridoriii
      changes:
        - sql:
            sql: >
              INSERT INTO users_roles (user_id, role_id)
              SELECT u.id, r.id
              FROM users u
              CROSS JOIN roles r
              WHERE r.name = 'USER'
              AND NOT EXISTS (
                  SELECT 1
                  FROM users_roles ur
                  WHERE ur.user_id = u.id
                  AND ur.role_id = r.id
              );

  - changeSet:
      id: create-admin-user
      author: midoridoriii
      changes:
        - insert:
            tableName: users
            columns:
              - column:
                  name: email
                  value: admin@bookstore.com
              - column:
                  name: password
                  value: "$2a$10$dXJ3SW6G7P50lGmMkkmwe.20cQQubK3.HZWzG3YB1tlRy.fqvM/BG"
              - column:
                  name: first_name
                  value: Admin
              - column:
                  name: last_name
                  value: User

  - changeSet:
      id: assign-admin-user-role
      author: midoridoriii
      changes:
        - insert:
            tableName: users_roles
            columns:
              - column:
                  name: user_id
                  valueComputed: "(SELECT id FROM users WHERE email = 'admin@bookstore.com')"
              - column:
                  name: role_id
                  valueComputed: "(SELECT id FROM roles WHERE name = 'USER')"

        - insert:
            tableName: users_roles
            columns:
              - column:
                  name: user_id
                  valueComputed: "(SELECT id FROM users WHERE email = 'admin@bookstore.com')"
              - column:
                  name: role_id
                  valueComputed: "(SELECT id FROM roles WHERE name = 'ADMIN')"
